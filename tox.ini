[tox]
envlist=check-manifest,ruff-check,ruff-format-diff,bandit,pytest

[testenv:check-manifest]
skip_install = true
skipsdist = true
deps =
  check-manifest
commands=
  {envpython} -m check_manifest {toxinidir}

[testenv:ruff-check]
basepython = python3
skip_install = true
deps =
  ruff
commands = ruff check .

[testenv:ruff-check-fix]
basepython = python3
skip_install = true
deps =
  ruff
commands = ruff check --fix .

[testenv:ruff-format-diff]
basepython = python3
skip_install = true
deps =
  ruff
commands = ruff format --check --diff .

[testenv:ruff-format-fix]
basepython = python3
skip_install = true
deps =
  ruff
commands = ruff format .

[testenv:bandit]
basepython = python3
skip_install = true
deps =
  bandit
# B404:import_subprocess Severity: Low Confidence: High => recitale should avoid using subprocess but for now the code is shlex'ed so ~safe
# B603:subprocess_without_shell_equals_true Severity: Low Confidence: High => see B404
# B701:jinja2_autoescape_false Severity: High Confidence: High => including HTML code from settings.yaml is a feature of recitale though highly unsecure. TODO: Find much safer work-around
commands = bandit -s B404,B603,B701 -r recitale

[testenv:pytest]
extras = tests
commands = pytest --cov={envsitepackagesdir}/recitale/ --cov-report=xml
