[build-system]
build-backend = "setuptools.build_meta"
requires = [
	"setuptools >= 77.0.3",
	"wheel",
]

[project]
classifiers = [
	"Development Status :: 4 - Beta",
	"Environment :: Console",
	"Intended Audience :: End Users/Desktop",
	"Programming Language :: Python :: 3 :: Only",
]
dependencies = [
	"Babel",
	"imagesize",
	"jinja2 >= 2.9",
	"pillow >= 6",
	"pycryptodomex",
	"ruamel.yaml < 0.18.0",
	"tqdm",
]
description = "A static website generator that allows you to tell a story with your pictures"
dynamic = [
	"version",
]
license = "GPL-3.0-or-later"
license-files = [
	"LICENSE",
]
maintainers = [
	{name = "Quentin Schulz", email = "foss+recitale@0leil.net"},
]
name = "recitale"
readme = "README.md"
requires-python = ">= 3.0"

[project.optional-dependencies]
tests = [
	"pytest",
	"pytest-cov",
]

[project.scripts]
recitale = "recitale.recitale:main"

[project.urls]
Documentation = "https://recitale.readthedocs.io/"
Homepage = "https://github.com/recitale/recitale"
Issues = "https://github.com/recitale/recitale/issues"
Repository = "https://github.com/recitale/recitale.git"

[tool.setuptools]
packages = [
	"recitale",
]

[tool.setuptools.dynamic]
version = {attr = "recitale.__version__"}
